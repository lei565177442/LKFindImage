name: Build LKFindImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify binary
        run: |
          file LKFindImage.dylib
          otool -L LKFindImage.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LKFindImage-dylib
          path: LKFindImage.dylib
